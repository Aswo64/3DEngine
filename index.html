<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    html, body {
        overflow: hidden;
        height: 100%;
    }
    .dropzone {
    display: inline-grid;
    position: fixed;
    border: 2px dashed #ccc;
    border-radius: 10px;
    padding: 20px;
    cursor: pointer;
    transition: background-color 0.3s ease, border-color 0.3s ease;
    width:auto;
    padding-top: 10px;
    left:1020px;
    }
    .dropzone:hover {
    border-color: #666;
    background-color: black;
    }
    .dropzone.active{
        border-color: #666;
        background-color: black;
    }

    .dropzone input[type="file"] {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    }
    .dropzone img {
        transition: filter 0.3s ease;
        transform: scale(0.75);
        filter: invert(0%);
    }
    .dropzone:hover img{
        filter:invert(100%)
    }

    .controls {
        position: fixed;
        left: 1020px;
        top: 160px;
        display: grid;
        gap: 10px;
        width: 220px;
        color: black;
        font-family: Arial, sans-serif;
    }

    .controls label {
        display: grid;
        gap: 6px;
        font-size: 14px;
    }

    .controls input[type="range"] {
        width: 100%;
    }
    
</style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <script src="engine.js" defer></script>

    <div class="dropzone">
        <img src="upload.svg" width="60" id="img"/>
        <input type="file" class="files" id="objFile"/>
    </div>

    <div class="controls">
        <label for="speedSlider">
            <span id="speedValue">Speed: 1.00x</span>
            <input type="range" id="speedSlider" min="0.25" max="3" step="0.05" value="1">
        </label>
    </div>
    
</body>
</html>
