<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    html, body {
        overflow: hidden;
        height: 100%;
    }
    .sidebar {
        position: fixed;
        left: 1020px;
        top: 10px;
        width: 220px;
    }

    .dropzone {
        position: relative;
        display: inline-grid;
        justify-items: center;
        align-items: center;
        border: 2px dashed #ccc;
        border-radius: 10px;
        cursor: pointer;
        transition: background-color 0.3s ease, border-color 0.3s ease;
        width: 100%;
        height: 100px;
        margin-bottom: 25px;
    }
    .dropzone:hover {
    border-color: #666;
    background-color: black;
    }
    .dropzone.active{
        border-color: #666;
        background-color: black;
    }

    .dropzone input[type="file"] {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    }
    .dropzone img {
        transition: filter 0.3s ease;
        transform: scale(0.75);
        filter: invert(0%);
    }
    .dropzone:hover img{
        filter:invert(100%)
    }

    .controls {
        display: grid;
        gap: 10px;
        width: 100%;
        color: black;
        font-family: Arial, sans-serif;
        justify-items: center;
    }

    .controls label {
        display: grid;
        gap: 6px;
        font-size: 14px;
        width: 100%;
        text-align: center;
        justify-items: center;
    }

    .controls input[type="range"] {
        width: 100%;
    }

    .rgbFields {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        width: 100%;
    }

    .rotationFields {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 70%;
        margin: 0 auto;
    }

    .rgbFields input[type="number"] {
        width: 100%;
    }

    .vectorFields {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        width: 100%;
    }

    .vectorFields input[type="number"] {
        width: 100%;
    }

    .controls button {
        width: 100%;
        padding: 6px 10px;
        border: 1px solid #666;
        background: #f2f2f2;
        color: #000;
        cursor: pointer;
    }

    .controls button:hover {
        background: #e0e0e0;
    }

    .controls select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #666;
        background: #f2f2f2;
        color: #000;
    }
    
</style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <script src="engine.js" defer></script>

    <div class="sidebar">
    <div class="dropzone">
        <img src="upload.svg" width="60" id="img"/>
        <input type="file" class="files" id="objFile"/>
    </div>

    <div class="controls">
        <label for="speedSlider">
            <span id="speedValue">Speed: 1.00x</span>
            <input type="range" id="speedSlider" min="0.25" max="3" step="0.05" value="1">
        </label>
        <label for="wireframeToggle">
            <span>Wireframe</span>
            <input type="checkbox" id="wireframeToggle" checked>
        </label>
        <label for="transparencyToggle">
            <span>Transparency</span>
            <input type="checkbox" id="transparencyToggle">
        </label>
        <label for="fillObjToggle">
            <span>Fill Object</span>
            <input type="checkbox" id="fillObjToggle">
        </label>
        <label for="cullToggle">
            <span>Cull Backfaces</span>
            <input type="checkbox" id="cullToggle" checked>
        </label>
        <label for="viewNormalToggle">
            <span>View Normals</span>
            <input type="checkbox" id="viewNormalToggle">
        </label>
        <label for="cwToggle">
            <span>Clockwise Winding</span>
            <input type="checkbox" id="cwToggle" checked>
        </label>
        
        <label for="dirLightToggle">
            <span>Directional Light</span>
            <input type="checkbox" id="dirLightToggle">
        </label>
        <label for="brightnessSlider">
            <span id="brightnessValue">Brightness: 0%</span>
            <input type="range" id="brightnessSlider" min="-100" max="100" step="1" value="0">
        </label>
        <label>
            <span>Colour (RGB)</span>
            <div class="rgbFields">
                <input type="number" id="colourRInput" min="0" max="255" step="1" value="0">
                <input type="number" id="colourGInput" min="0" max="255" step="1" value="100">
                <input type="number" id="colourBInput" min="0" max="255" step="1" value="0">
            </div>
        </label>
        <label>
            <span>Rotation (X, Y)</span>
            <div class="rgbFields rotationFields">
                <input type="number" id="rotXInput" step="0.05" value="0">
                <input type="number" id="rotYInput" step="0.05" value="0">
            </div>
        </label>
        <label for="rotAnimToggle">
            <span>Rotation Animation</span>
            <input type="checkbox" id="rotAnimToggle">
        </label>
        <label>
            <span>Light Direction (X, Y, Z)</span>
            <div class="vectorFields">
                <input type="number" id="lightDirXInput" step="0.1" value="1">
                <input type="number" id="lightDirYInput" step="0.1" value="0">
                <input type="number" id="lightDirZInput" step="0.1" value="0">
            </div>
        </label>
        <button type="button" id="addLightDirButton">Add Light Direction</button>
        <label for="lightDirDropdown">
            <span>lightDir Array</span>
            <select id="lightDirDropdown"></select>
        </label>
        
    </div>
    </div>
    
</body>
</html>
