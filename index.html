<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    html, body {
        overflow: hidden;
        height: 100%;
    }
    .dropzone {
    display: inline-grid;
    position: fixed;
    border: 2px dashed #ccc;
    border-radius: 10px;
    padding: 20px;
    cursor: pointer;
    transition: background-color 0.3s ease, border-color 0.3s ease;
    width:auto;
    top:50%;
    left:1020px;
    transform: translateY(-50%);
    }
    .dropzone:hover {
    border-color: #666;
    background-color: black;
    }
    .dropzone.active{
        border-color: #666;
        background-color: black;
    }

    .dropzone input[type="file"] {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    }
    .dropzone img {
        transition: filter 0.3s ease;
        transform: scale(0.75);
        filter: invert(0%);
    }
    .dropzone:hover img{
        filter:invert(100%)
    }
    
</style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <script src="engine.js" defer></script>

    <div class="dropzone">
        <img src="upload.svg" width="60" id="img"/>
        <input type="file" class="files" id="objFile"/>
    </div>
    
</body>
</html>
